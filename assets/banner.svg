    <circle cx="0" cy="0" r="48" fill="#fffbeb" stroke="#451a03" stroke-width="3"/>
    <path d="M -52 0 Q 0 -56 52 0 Q 0 56 -52 0 Z" fill="#ffffff" stroke="#881337" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="url(#irisGrad)" stroke="#0284c7" stroke-width="2"/>
    <circle cx="0" cy="0" r="13" fill="#881337"/>
    <circle cx="3" cy="0" r="10" fill="#030712"/>
    <circle cx="-7" cy="-8" r="4" fill="#ffffff"/>
