        <path d="M-18 0 Q0 -11 18 0 Q0 11 -18 0 Z" fill="#fffbeb" stroke="#881337" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="5" fill="#e11d48"/>
        <circle cx="0" cy="0" r="2" fill="#1e1b4b"/>
      </g>
      <g transform="translate(0, 85)">
