  <!-- Typography & Description -->
  <text x="360" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#gradText)">OPHANIM</text>
  <text x="364" y="190" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="700" font-size="19" letter-spacing="6" fill="url(#gradSub)">AUTONOMOUS HOMELAB SRE &amp; MONITORING</text>
  
  <text x="364" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#cbd5e1">The Many-Eyed Observability Engine &amp; Self-Healing Agent for Homelabs</text>
  <text x="364" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">Pure Go static binary • Embedded React UI • Dynamic Topology Graph • Multi-Agent RCA</text>

  <!-- Pill Badges -->
