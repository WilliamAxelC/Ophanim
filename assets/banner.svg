      L -16 198 L -40 214 L -50 186 L -78 196 L -82 168 L -112 172 L -110 142 L -140 140 L -132 112 L -162 104 L -148 76 L -176 62 L -156 36 L -180 16 L -156 0 L -180 -16 L -156 -36 L -176 -62 L -148 -76 L -162 -104 L -132 -112 L -140 -140 L -110 -142 L -112 -172 L -82 -168 L -78 -196 L -50 -186 L -40 -214 L -16 -198 Z
