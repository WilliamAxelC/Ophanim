      <ellipse cx="0" cy="0" rx="205" ry="100" fill="none" stroke="#451a03" stroke-width="3.5"/>
      <ellipse cx="0" cy="0" rx="175" ry="70" fill="none" stroke="#451a03" stroke-width="3.5"/>
      <!-- Eyes -->
