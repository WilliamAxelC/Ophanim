    <rect width="90" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">PURE GO</text>
  </g>
  <g transform="translate(464, 300)">
    <rect width="115" height="26" rx="6" fill="#e11d48" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
    <text x="57" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#fb7185" text-anchor="middle">CGO-FREE</text>
  </g>
  <g transform="translate(589, 300)">
    <rect width="125" height="26" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="62" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">EMBEDDED UI</text>
  </g>
  <g transform="translate(724, 300)">
    <rect width="125" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <text x="62" y="17" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">AGENTIC SRE</text>
