hub:
  listen_addr: "0.0.0.0"
  port: 8085
  poll_interval: 10s
  retention_days: 30

storage:
  db_path: "/data/ophanim.db"
  ring_buffer_lines: 1000

llm:
  enabled: false

chatops:
  discord:
    enabled: false
  telegram:
    enabled: false

thresholds:
  cpu_critical_percent: 95.0
  memory_critical_percent: 95.0
  disk_critical_percent: 92.0
  auto_heal_max_per_hour: 2
  anti_flap_window: 5m
